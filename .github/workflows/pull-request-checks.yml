name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        id: tests
        continue-on-error: true
        run: bun run test -- --ci --runInBand --json --outputFile=jest-results.json

      - name: Add test results to job summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'jest-results.json';

          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Test results\n\nJest did not produce a report. Check the test step logs.\n');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = report.testResults.flatMap((file) => {
            const failedTests = (file.assertionResults ?? []).filter(
              (test) => test.status === 'failed'
            );
            if (failedTests.length) {
              return failedTests.map((test) => ({
                name: test.fullName,
                file: file.name,
                message: (test.failureMessages ?? []).join('\n'),
              }));
            }
            return file.status === 'failed'
              ? [{ name: 'Test suite failed to run', file: file.name, message: file.message ?? '' }]
              : [];
          });
          const failureDetails = failures.map(({ name, file, message }) => {
            const cleanMessage = message
              .replace(/\u001b\[[0-9;]*m/g, '')
              .slice(0, 4000);
            const truncationNote = message.length > 4000 ? '\n… output truncated …' : '';
            return `- **${name}** — \`${file}\`\n\n  <details><summary>Failure details</summary>\n\n  \`\`\`\`text\n${cleanMessage}${truncationNote}\n  \`\`\`\`\n\n  </details>`;
          });
          const summary = failures.length
            ? `## Failed tests (${failures.length})\n\n${failureDetails.join('\n\n')}\n`
            : '## Tests\n\nAll Jest tests passed.\n';

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Test real note editor
        run: bun run test:note-editor

      - name: Run lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
